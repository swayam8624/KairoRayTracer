name: Add environment fog
on:
  push:
    branches:
      - agent/phase6-shared-light-semantics
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/phase6-shared-light-semantics
      - run: python3 .github/scripts/add_environment_fog.py
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Apply authored environment fog in offline beauty renders"
          git push
