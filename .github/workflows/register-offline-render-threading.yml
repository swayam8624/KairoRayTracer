name: Register offline render threading

on:
  push:
    branches:
      - agent/complete-roadmap

permissions:
  contents: write

jobs:
  register:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/complete-roadmap
          fetch-depth: 0
      - name: Link portable thread runtime
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          cmake = Path('CMakeLists.txt')
          text = cmake.read_text()
          if 'find_package(Threads REQUIRED)' not in text:
              text = text.replace('option(KAIRO_RAYTRACER_BUILD_PREVIEW "Build GLFW preview executable" ON)\n',
                  'option(KAIRO_RAYTRACER_BUILD_PREVIEW "Build GLFW preview executable" ON)\n\nfind_package(Threads REQUIRED)\n', 1)
          text = text.replace('target_link_libraries(KairoRayTracer PUBLIC KairoSpatial KairoAssets)\n',
                              'target_link_libraries(KairoRayTracer PUBLIC KairoSpatial KairoAssets Threads::Threads)\n', 1)
          cmake.write_text(text)
          Path('.github/workflows/register-offline-render-threading.yml').unlink()
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Link offline render jobs to portable thread runtime'
          git push origin HEAD:agent/complete-roadmap
