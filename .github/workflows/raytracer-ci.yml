name: KairoRayTracer CI

on:
  push:
    branches: [main, agent/complete-roadmap]
  pull_request:

jobs:
  build-test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            name: Ubuntu Clang
            toolchain: clang
          - os: macos-14
            name: macOS LLVM
            toolchain: brew-llvm
          - os: windows-2022
            name: Windows MSVC
            toolchain: msvc
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Install Ubuntu toolchain
        if: matrix.toolchain == 'clang'
        run: sudo apt-get update && sudo apt-get install -y clang ninja-build
      - name: Install LLVM and Ninja on macOS
        if: matrix.toolchain == 'brew-llvm'
        run: brew install llvm ninja
      - name: Activate MSVC
        if: matrix.toolchain == 'msvc'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Configure
        shell: bash
        run: |
          if [[ "${{ matrix.toolchain }}" == "clang" ]]; then export CC=clang CXX=clang++; fi
          if [[ "${{ matrix.toolchain }}" == "brew-llvm" ]]; then
            export PATH="$(brew --prefix llvm)/bin:$PATH"
            export CC="$(brew --prefix llvm)/bin/clang"
            export CXX="$(brew --prefix llvm)/bin/clang++"
          fi
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DKAIRO_RAYTRACER_BUILD_TESTS=ON -DKAIRO_RAYTRACER_BUILD_PREVIEW=OFF
      - name: Build
        run: cmake --build build --parallel 2
      - name: Test
        run: ctest --test-dir build --output-on-failure
