name: Patch scene parser portability

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/patch-scene-parser-portability.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Apply portable float parser
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('SceneParser.cppm')
          s = p.read_text()
          if '#include <locale>\n' not in s:
              s = s.replace('#include <fstream>\n', '#include <fstream>\n#include <locale>\n')
          old = '''            // std::from_chars avoids locale surprises and lets us verify that
            // the whole token was consumed. "1abc" should not parse as 1.
            float value = 0.0f;
            const char* begin = token.Text.data();
            const char* end = begin + token.Text.size();
            const auto [ptr, ec] = std::from_chars(begin, end, value);
            if (ec != std::errc{} || ptr != end)
            {
                Fail(line, token.Column, "invalid float `" + token.Text + "`.");
            }

            return value;
'''
          new = '''            // Floating-point std::from_chars in Homebrew libc++ is gated by
            // the macOS deployment target. A classic-locale stream preserves
            // deterministic decimal parsing while remaining available on the
            // supported macOS versions. Requiring EOF rejects partial tokens
            // such as "1abc" just like the previous from_chars path.
            std::istringstream stream(token.Text);
            stream.imbue(std::locale::classic());
            float value = 0.0f;
            stream >> value;
            if (!stream || stream.peek() != std::char_traits<char>::eof())
            {
                Fail(line, token.Column, "invalid float `" + token.Text + "`.");
            }

            return value;
'''
          if old not in s:
              raise SystemExit('expected ParseFloat block not found')
          p.write_text(s.replace(old, new))
          PY
          rm .github/workflows/patch-scene-parser-portability.yml
      - name: Commit fix and self-clean
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add SceneParser.cppm .github/workflows/patch-scene-parser-portability.yml
          git commit -m "Make scene float parsing portable on macOS"
          git push origin HEAD:main
