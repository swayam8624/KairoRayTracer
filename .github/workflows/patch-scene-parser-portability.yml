name: Patch scene parser portability

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/patch-scene-parser-portability.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Apply portable float parser
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('SceneParser.cppm')
          s = p.read_text()
          if '#include <locale>\n' not in s:
              s = s.replace('#include <fstream>\n', '#include <fstream>\n#include <locale>\n')

          pattern = re.compile(
              r'        \[\[nodiscard\]\]\n'
              r'        inline float ParseFloat\(.*?'
              r'\n        \}\n\n'
              r'        \[\[nodiscard\]\]\n'
              r'        inline std::uint32_t ParseUInt',
              re.S)

          replacement = '''        [[nodiscard]]
          inline float ParseFloat(
              const Token& token,
              std::uint32_t line)
          {
              // Floating-point std::from_chars in Homebrew libc++ is gated by
              // the macOS deployment target. A classic-locale stream preserves
              // deterministic decimal parsing while remaining available on the
              // supported macOS versions. Requiring EOF rejects partial tokens.
              std::istringstream stream(token.Text);
              stream.imbue(std::locale::classic());
              float value = 0.0f;
              stream >> value;
              if (!stream || stream.peek() != std::char_traits<char>::eof())
              {
                  Fail(line, token.Column, "invalid float `" + token.Text + "`.");
              }

              return value;
          }

          [[nodiscard]]
          inline std::uint32_t ParseUInt'''

          s, count = pattern.subn(replacement, s, count=1)
          if count != 1:
              raise SystemExit(f'expected exactly one ParseFloat function, replaced {count}')
          p.write_text(s)
          PY
          rm .github/workflows/patch-scene-parser-portability.yml
      - name: Commit fix and self-clean
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add SceneParser.cppm .github/workflows/patch-scene-parser-portability.yml
          git commit -m "Make scene float parsing portable on macOS"
          git push origin HEAD:main
